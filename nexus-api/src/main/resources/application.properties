# Datasource — em produção, defina DB_URL/DB_USERNAME/DB_PASSWORD como variáveis de
# ambiente. Os valores depois do ":" abaixo são só fallback de desenvolvimento local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2208}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS — domínio(s) do frontend, separados por vírgula (sem espaço nenhum extra além
# do que já tem depois da vírgula). Ex.: CORS_ALLOWED_ORIGINS=https://app.seudominio.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-4-5-20251001
# Só necessário se a sua ANTHROPIC_API_KEY for do tipo "identity-linked" — pegue o ID
# em https://console.anthropic.com (seletor de workspace, no canto superior).
anthropic.workspace.id=${ANTHROPIC_WORKSPACE_ID:}

# JWT
# IMPORTANTE: em produção, defina JWT_SECRET como variável de ambiente com um valor
# aleatório de pelo menos 256 bits (32 bytes). O valor abaixo é apenas um fallback de
# desenvolvimento e NUNCA deve ser usado em produção.
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWRldi1vbmx5LW5leHVzLWFwaS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}