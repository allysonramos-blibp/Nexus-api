# Datasource — em produção, defina DB_URL/DB_USERNAME/DB_PASSWORD como variáveis de
# ambiente. Os valores depois do ":" abaixo são só fallback de desenvolvimento local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2208}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS — domínio(s) do frontend, separados por vírgula (sem espaço nenhum extra além
# do que já tem depois da vírgula). O padrão já inclui o domínio da Vercel em produção;
# defina CORS_ALLOWED_ORIGINS para sobrescrever (ex.: se trocar de domínio depois).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://nexus-front-phi.vercel.app}

# CONFIGURAÇÃO GOOGLE GEMINI API
gemini.api.key=${GEMINI_API_KEY:}
# Você pode usar gemini-2.5-flash ou gemini-3.7-flash conforme sua preferência de modelo
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}


# JWT
# IMPORTANTE: em produção, defina JWT_SECRET como variável de ambiente com um valor
# aleatório de pelo menos 256 bits (32 bytes). O valor abaixo é apenas um fallback de
# desenvolvimento e NUNCA deve ser usado em produção.
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWRldi1vbmx5LW5leHVzLWFwaS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}